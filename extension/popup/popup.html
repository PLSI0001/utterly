<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Utterly</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="logo-text">Utterly.</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="activeToggle" checked>
      <span class="slider round"></span>
    </label>
  </div>

  <div class="content">
    <div class="status-container">
      <div id="statusIndicator" class="indicator idle"></div>
      <span id="statusText">Ready to capture</span>
    </div>

    <div class="form-group">
      <label for="toneSelect">Refinement Tone</label>
      <select id="toneSelect">
        <option value="Professional">Professional</option>
        <option value="Casual">Casual</option>
        <option value="Formal">Formal</option>
        <option value="Friendly">Friendly</option>
        <option value="Academic">Academic</option>
        <option value="Creative">Creative</option>
        <option value="Direct">Direct</option>
        <option value="Persuasive">Persuasive</option>
      </select>
    </div>

    <div class="shortcut-info">
      <span>Shortcut: <kbd id="shortcutKeys">Ctrl+Shift+U</kbd></span>
      <button id="customizeBtn" class="text-btn">Change</button>
    </div>
  </div>

  <div class="footer">
    <button id="feedbackBtn" class="text-btn">Feedback</button>
    <a href="#" id="settingsLink" class="text-btn">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
